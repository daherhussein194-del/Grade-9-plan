<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Study Planner</title>
<style>
body{margin:0;background:#f4f6fb;font-family:Arial;color:#182033}.wrap{max-width:760px;margin:auto}
header{background:#4c6fff;color:white;padding:24px 18px;border-radius:0 0 24px 24px}h1{margin:0}.sub{margin-top:6px}
nav{display:flex;gap:7px;overflow:auto;padding:12px;background:white;position:sticky;top:0}nav button{border:0;border-radius:20px;padding:9px 13px;font-weight:bold;white-space:nowrap}nav .a{background:#4c6fff;color:white}
.card{background:white;margin:12px;padding:16px;border-radius:18px;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
input,select{width:100%;padding:10px;border:1px solid #d5dae5;border-radius:10px;margin:4px 0;font-size:15px}.btn{border:0;border-radius:11px;padding:11px;font-weight:bold}.add{background:#40c057;color:white}.session{border:1px solid #e0e4ec;border-radius:14px;padding:12px;margin:9px 0}.top{display:flex;justify-content:space-between}.subject{font-weight:bold}.meta{font-size:13px;color:#687386;margin-top:4px}.done{opacity:.5}.done .subject{text-decoration:line-through}.progress{height:11px;background:#e9ecf2;border-radius:20px;overflow:hidden}.bar{height:100%;background:#40c057;width:0}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><h1>📚 My Study Planner</h1><div class="sub">Mathematics • Physics • Chemistry • History • Biology</div></header>
<nav id="days"></nav>
<div class="card"><h2 id="title"></h2><div id="summary" class="meta"></div><div class="progress"><div id="bar" class="bar"></div></div></div>
<div class="card"><h3>➕ Add a study session</h3><div class="grid">
<input id="start" placeholder="Start time"><input id="end" placeholder="Finish / deadline time">
<select id="sub"><option>Mathematics</option><option>Physics</option><option>Chemistry</option><option>History</option><option>Biology</option></select>
<input id="unit" placeholder="Unit / chapter"><input id="pages" placeholder="Pages e.g. 12–20"><input id="date" type="date"></div>
<input id="notes" placeholder="What exactly must I finish?"><button class="btn add" onclick="add()">Add session</button></div>
<div class="card"><h3>Today's sessions</h3><div id="list"></div></div>
</div>
<script>
const days=['Thursday','Friday','Saturday','Sunday','Monday','Tuesday','Wednesday'];let day='Saturday';
let data=JSON.parse(localStorage.data||'{}'),done=JSON.parse(localStorage.done||'{}');days.forEach(d=>data[d]??=[]);
function save(){localStorage.data=JSON.stringify(data);localStorage.done=JSON.stringify(done)}
function render(){let n=document.getElementById('days');n.innerHTML='';days.forEach(d=>{let b=document.createElement('button');b.textContent=d;b.className=d==day?'a':'';b.onclick=()=>{day=d;render()};n.appendChild(b)});
title.textContent=day+' — Study Plan';list.innerHTML='';let a=data[day];a.forEach((x,i)=>{let k=day+i,e=document.createElement('div');e.className='session '+(done[k]?'done':'');e.innerHTML='<div class="top"><div><div class="subject">'+x.s+'</div><div class="meta">⏰ '+x.start+' → '+x.end+'</div><div class="meta">📖 '+x.unit+' · Pages: '+(x.pages||'—')+'</div>'+(x.date?'<div class="meta">🎯 Deadline: '+x.date+'</div>':'')+(x.notes?'<div class="meta">📝 '+x.notes+'</div>':'')+'</div><input type="checkbox" style="width:22px" '+(done[k]?'checked':'')+' onchange="toggle('+i+')"></div>';list.appendChild(e)});
let c=a.filter((_,i)=>done[day+i]).length,p=a.length?Math.round(c/a.length*100):0;summary.textContent=c+' of '+a.length+' sessions completed';bar.style.width=p+'%'}
function add(){if(!start.value||!end.value||!unit.value){alert('Enter start time, finish time, and unit/chapter.');return}data[day].push({start:start.value,end:end.value,s:sub.value,unit:unit.value,pages:pages.value,date:date.value,notes:notes.value});['start','end','unit','pages','date','notes'].forEach(x=>document.getElementById(x).value='');save();render()}
function toggle(i){done[day+i]=!done[day+i];save();render()}render();
</script></body></html>
